packages:
  - apps/*
  - packages/*

allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  sharp: false
  workerd: true

engineStrict: true

# A release younger than a day is not installed: most hijacked npm versions
# are pulled within hours. Pin the previous version when a fresh one is needed.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@adrienlcp/*'

patchedDependencies:
  '@adrienlcp/i18n@0.5.2': patches/@adrienlcp__i18n@0.5.2.patch
publicHoistPattern:
  - '@biomejs/*'
