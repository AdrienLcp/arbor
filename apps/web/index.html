<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport" />
    <!-- The --paper token in each palette: if it moves, these move with it. -->
    <meta content="#f1f5f8" data-scheme="light" media="(prefers-color-scheme: light)" name="theme-color" />
    <meta content="#101724" data-scheme="dark" media="(prefers-color-scheme: dark)" name="theme-color" />
    <link as="font" crossorigin href="/fonts/atkinson-latin.woff2" rel="preload" type="font/woff2" />
    <link as="font" crossorigin href="/fonts/barlow-condensed-extrabold-latin.woff2" rel="preload" type="font/woff2" />
    <title>Arbor</title>
    <meta
      content="Votre arbre généalogique, en ligne et à plusieurs. Vous l’envoyez sur WhatsApp, chacun y ajoute les siens, et il s’imprime en grand."
      name="description"
    />
    <link href="https://arbor.adrienlcp.com/" rel="canonical" />
    <link href="/favicon.svg" rel="icon" type="image/svg+xml" />
    <link href="/apple-touch-icon.png" rel="apple-touch-icon" />
    <meta content="Arbor" property="og:site_name" />
    <meta content="Arbor — L’arbre de votre famille" property="og:title" />
    <meta
      content="Votre arbre généalogique, en ligne et à plusieurs. Vous l’envoyez sur WhatsApp, chacun y ajoute les siens, et il s’imprime en grand."
      property="og:description"
    />
    <meta content="website" property="og:type" />
    <meta content="https://arbor.adrienlcp.com/" property="og:url" />
    <meta content="fr_FR" property="og:locale" />
    <meta content="https://arbor.adrienlcp.com/og-image.png" property="og:image" />
    <meta content="1200" property="og:image:width" />
    <meta content="630" property="og:image:height" />
    <meta
      content="Arbor : un petit arbre de famille fait de vignettes d’album, avec une case encore vide à compléter."
      property="og:image:alt"
    />
    <meta content="summary_large_image" name="twitter:card" />
    <!--
      A layer's position is fixed where its name first appears, and Vite injects
      stylesheets in module-graph order: declared here, the order cannot depend
      on which component happened to be imported first.
    -->
    <style>
      @layer reset, tokens, base, components;
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script src="/src/main.tsx" type="module"></script>
  </body>
</html>
